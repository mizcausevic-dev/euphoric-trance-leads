name: Materialize pack

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Download and check the source tarball
        run: |
          curl -fsSL -o /tmp/euphoric-trance-leads-src.tar.gz "https://d.uguu.se/acbJEQRu.tar.gz"
          echo "ca8f93bb39c93ad8efc575ae578017c777471a50f681f58b58a165dde0e713b8  /tmp/euphoric-trance-leads-src.tar.gz" | sha256sum -c -
          tar -xzf /tmp/euphoric-trance-leads-src.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Build
        run: python3 tools/build_pack.py

      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Add rendered MIDI pack assets [skip ci]"
            git push
          fi
