name: Materialize pack

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Download and check the source tarball
        run: |
          curl -fsSL -o /tmp/euphoric-trance-leads-src.tar.gz "https://d.uguu.se/vmnWJsNh.tar.gz"
          echo "8b4a408280ea0cc99467873e5084b4ea978e3fa92a2167965c29adee6453384e  /tmp/euphoric-trance-leads-src.tar.gz" | sha256sum -c -
          tar -xzf /tmp/euphoric-trance-leads-src.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Build
        run: python3 tools/build_pack.py

      - name: Publish the gh-pages branch as the site source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          echo "pages create $code"
          cat /tmp/pages.json
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            code=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
            echo "pages update $code"
            cat /tmp/pages-put.json
          fi
          case "$code" in
            200|201|204|409) ;;
            *) exit 1 ;;
          esac

      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Add rendered MIDI pack assets [skip ci]"
            git push
          fi
